<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DnyanAI Hospital</title>
  <style>
    :root {
      --blue: #1a73e8;
      --line: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --font: "Google Sans", "Segoe UI", Roboto, "Plus Jakarta Sans", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: var(--font);
      background: #f8f9fa;
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }

    .portal {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .portal-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }

    .brand .logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
      box-shadow: 0 1px 3px rgba(26, 115, 232, 0.4);
    }

    .switch {
      margin-left: auto;
      display: flex;
      gap: 2px;
      padding: 3px;
      background: #f1f3f4;
      border-radius: 999px;
    }

    .switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .switch button.active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.2);
    }

    .switch button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .frames {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .frames iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .frames iframe[hidden] { display: none; }

    @media (max-width: 600px) {
      .portal-header { flex-wrap: wrap; gap: 6px; padding: 6px 8px; }
      .brand { font-size: 14px; }
      .switch { margin-left: 0; width: 100%; }
      .switch button { flex: 1; padding: 9px 8px; font-size: 13px; }
    }
  </style>
</head>

<body>
  <div class="portal">
    <header class="portal-header">
      <div class="brand"><span class="logo">✚</span><span>DnyanAI Hospital</span></div>
      <div class="switch" id="appSwitch" role="tablist" aria-label="Choose app">
        <button type="button" data-app="calendar" class="active" role="tab" aria-selected="true">📅 Calendar</button>
        <button type="button" data-app="chatbot" role="tab" aria-selected="false">💬 Chatbot</button>
      </div>
    </header>

    <div class="frames">
      <iframe id="calendarFrame" src="/calendar/" title="Clinic calendar"></iframe>
      <iframe id="chatFrame" src="/chat/" title="Receptionist chatbot" hidden></iframe>
    </div>
  </div>

  <script>
    const calendarFrame = document.getElementById("calendarFrame");
    const chatFrame = document.getElementById("chatFrame");
    const buttons = [...document.querySelectorAll("#appSwitch button")];

    function selectApp(name) {
      const isCalendar = name === "calendar";
      calendarFrame.hidden = !isCalendar;
      chatFrame.hidden = isCalendar;
      buttons.forEach((button) => {
        const active = button.dataset.app === name;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
      });
      history.replaceState(null, "", `#${name}`);
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => selectApp(button.dataset.app));
    });

    window.addEventListener("hashchange", () => {
      selectApp(location.hash === "#chatbot" ? "chatbot" : "calendar");
    });

    selectApp(location.hash === "#chatbot" ? "chatbot" : "calendar");
  </script>
</body>

</html>
